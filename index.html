<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <div class="left">
      <h2>Your Result</h2>
      <section>
        <div id="score">
          <h1 id="increase">76</h1>
          <p id="percent">of 100</p> 
        </div>

      </section>
    
      <h1>Great</h1>
      <p id="score-detail">You scored higher than 65% of the people who have taken these tests.</p>
    
    </div>

    <div class="right">
        <h2>Summary</h2>

      <div id="first">
          <p>Reaction</p>
          <p>80 / 100</p>
      </div>

      <div id="second">
        <p> Memory</p>
        <p>92 / 100</p>
      </div>

      <div id="third">
        <p>Verbal</p>
        <p>61 / 100</p> 
      </div>
    
        <div id="fourth">
          <p>Visual </p>
          <p>72 / 100</p>
        </div>
      
      <button>Continue</button>  

    </div>

  </div>

    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>
</html>
